<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSY2001 Biological Psychology · interactive self-study</title>
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body>
<header>
  <div class="course">PSY2001 · Biological Psychology · self-study</div>
  <h1 id="page-title">The Action Potential</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>© Dr. Clive Wong · The Education University of Hong Kong · PSY2001 Biological Psychology self-study. All values illustrative.</footer>
<script type="module">
  const pages = {
    "/ap/1": { title: "P1 · Wire vs. chain", mod: "./js/ap/page1.js", group: "Module 1 · The Action Potential" },
    "/ap/2": { title: "P2 · The resting membrane", mod: "./js/ap/page2.js", group: "Module 1 · The Action Potential" },
    "/ap/3": { title: "P3 · Stimulate & record", mod: "./js/ap/page3.js", group: "Module 1 · The Action Potential" },
    "/ap/4": { title: "P4 · All-or-none", mod: "./js/ap/page4.js", group: "Module 1 · The Action Potential" },
    "/ap/5": { title: "P5 · Scrub the action potential", mod: "./js/ap/page5.js", group: "Module 1 · The Action Potential" },
    "/ap/6": { title: "P6 · Propagation", mod: "./js/ap/page6.js", group: "Module 1 · The Action Potential" },
    "/ap/7": { title: "P7 · Myelin & speed", mod: "./js/ap/page7.js", group: "Module 1 · The Action Potential" },
    "/ap/8": { title: "P8 · What pushes a neuron to fire?", mod: "./js/ap/page8.js", group: "Module 1 · The Action Potential" },
    "/synapses/1": { title: "S1 · Transmission cycle", mod: "./js/syn/syn1.js", group: "Module 2 · Synapses" },
    "/synapses/2": { title: "S2 · Summation", mod: "./js/syn/syn2.js", group: "Module 2 · Synapses" },
    "/synapses/3": { title: "S3 · Fast vs slow receptors", mod: "./js/syn/syn3.js", group: "Module 2 · Synapses" },
    "/synapses/4": { title: "S4 · Reflex delay", mod: "./js/syn/syn4.js", group: "Module 2 · Synapses" },
    "/synapses/5": { title: "S5 · Blocking reuptake", mod: "./js/syn/syn5.js", group: "Module 2 · Synapses" },
    "/synapses/6": { title: "S6 · Gap junctions", mod: "./js/syn/syn6.js", group: "Module 2 · Synapses" },
  };
  const nav = document.getElementById("nav");
  const groups=[...new Set(Object.values(pages).map(p=>p.group))];
  nav.innerHTML = `<a href="#/" data-route="/" class="nav-home">Home</a>`+
    groups.map(g=>
      `<span class="nav-group"><span class="nav-label">${g}</span>`+
      Object.keys(pages).filter(p=>pages[p].group===g).map(p =>
        `<a href="#${p}" data-route="${p}">${pages[p].title}</a>`+
        (p==="/ap/4"?`<span class="nav-break"></span>`:"")).join("")+
      `</span>`).join("");

  async function route(){
    const h = location.hash.slice(1) || "/";
    const pg = pages[h];
    document.getElementById("page-title").textContent =
      pg ? pg.title : "PSY2001 · Biological Psychology";
    nav.querySelectorAll("a").forEach(a =>
      a.classList.toggle("active", a.dataset.route === h));
    const app = document.getElementById("app");
    if (!pg) {
      const m = await import("./js/home.js?v=2");
      m.render(app);
    } else if (pg.mod) {
      const m = await import(pg.mod + "?v=2");
      m.render(app);
    } else {
      app.innerHTML = `<div class="card"><p class="placeholder">This page is under construction —
        the keyframe storyboard is locked; the interactive is coming.</p></div>`;
    }
  }
  addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
